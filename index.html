<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIT Student Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f5f0;
    --color-background-tertiary: #eeede8;
    --color-background-info: #e6f1fb;
    --color-background-warning: #faeeda;
    --color-background-danger: #fcebeb;
    --color-background-success: #eaf3de;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #5f5e5a;
    --color-text-tertiary: #888780;
    --color-text-info: #0c447c;
    --color-text-warning: #633806;
    --color-text-danger: #791f1f;
    --color-text-success: #27500a;
    --color-border-tertiary: rgba(0,0,0,0.12);
    --color-border-secondary: rgba(0,0,0,0.22);
    --color-border-primary: rgba(0,0,0,0.35);
    --color-border-info: #85b7eb;
    --color-border-warning: #ef9f27;
    --color-border-danger: #f09595;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
    --border-radius-xl: 16px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1e1e1c;
      --color-background-secondary: #2a2a27;
      --color-background-tertiary: #141412;
      --color-background-info: #042c53;
      --color-background-warning: #412402;
      --color-background-danger: #501313;
      --color-background-success: #173404;
      --color-text-primary: #f0efe8;
      --color-text-secondary: #b4b2a9;
      --color-text-tertiary: #888780;
      --color-text-info: #85b7eb;
      --color-text-warning: #fac775;
      --color-text-danger: #f09595;
      --color-text-success: #97c459;
      --color-border-tertiary: rgba(255,255,255,0.1);
      --color-border-secondary: rgba(255,255,255,0.2);
      --color-border-primary: rgba(255,255,255,0.35);
      --color-border-info: #185fa5;
      --color-border-warning: #854f0b;
      --color-border-danger: #a32d2d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--color-background-tertiary); min-height: 100vh; padding: 1rem; }
  .dashboard { max-width: 1100px; margin: 0 auto; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; padding: 0.75rem 1rem; background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); }
  .top-bar h1 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .top-bar span { font-size: 13px; color: var(--color-text-secondary); }
  .edit-btn { font-size: 13px; padding: 6px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .edit-btn:hover { background: var(--color-background-secondary); }
  .edit-btn.active { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1rem; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); padding: 1rem; }
  .panel-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; }
  .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .link-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); text-decoration: none; cursor: pointer; position: relative; transition: border-color 0.15s; background: var(--lc-bg, var(--color-background-secondary)); }
  .link-card:hover { border-color: var(--color-border-primary); }
  .link-card .lc-icon { font-size: 18px; color: var(--lc-text, var(--color-text-secondary)); }
  .link-card .lc-name { font-size: 13px; font-weight: 500; color: var(--lc-text, var(--color-text-primary)); line-height: 1.3; }
  .link-card .lc-tag { font-size: 11px; color: var(--lc-sub, var(--color-text-tertiary)); }
  .link-card .del-btn { position: absolute; top: 6px; right: 6px; background: var(--color-background-danger); border: none; border-radius: 4px; cursor: pointer; color: var(--color-text-danger); width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 12px; }
  .link-card .color-btn { position: absolute; bottom: 6px; right: 6px; background: none; border: none; cursor: pointer; color: var(--lc-text, var(--color-text-tertiary)); width: 18px; height: 18px; display: none; align-items: center; justify-content: center; font-size: 13px; }
  .edit-mode .link-card .del-btn { display: flex; }
  .edit-mode .link-card .color-btn { display: flex; }
  .link-card.add-card { border-style: dashed; justify-content: center; align-items: center; min-height: 72px; color: var(--color-text-tertiary); font-size: 13px; gap: 6px; background: transparent; }
  .link-card.add-card:hover { color: var(--color-text-primary); border-color: var(--color-border-primary); }
  .alert-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--ai-border, var(--color-border-warning)); background: var(--ai-bg, var(--color-background-warning)); margin-bottom: 8px; position: relative; }
  .alert-item .ai-icon { font-size: 16px; color: var(--ai-text, var(--color-text-warning)); flex-shrink: 0; margin-top: 1px; }
  .alert-item .ai-name { font-size: 13px; color: var(--ai-text, var(--color-text-primary)); font-weight: 500; }
  .alert-item .ai-msg { font-size: 13px; color: var(--ai-text, var(--color-text-primary)); line-height: 1.5; }
  .alert-item .ai-meta { font-size: 11px; color: var(--ai-sub, var(--color-text-secondary)); margin-top: 2px; }
  .alert-item .del-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; color: var(--color-text-tertiary); display: none; font-size: 14px; }
  .alert-item .color-btn { position: absolute; bottom: 8px; right: 8px; background: none; border: none; cursor: pointer; color: var(--ai-text, var(--color-text-tertiary)); display: none; font-size: 13px; }
  .edit-mode .alert-item .del-btn { display: block; }
  .edit-mode .alert-item .color-btn { display: block; }
  .countdown-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
  .cd-card { border-radius: var(--border-radius-md); padding: 10px; text-align: center; border: 0.5px solid var(--cd-border, var(--color-border-tertiary)); background: var(--cd-bg, var(--color-background-secondary)); position: relative; }
  .cd-num { font-size: 24px; font-weight: 500; color: var(--cd-text, var(--color-text-primary)); }
  .cd-label { font-size: 11px; color: var(--cd-sub, var(--color-text-secondary)); margin-top: 2px; }
  .cd-card.urgent .cd-num { color: var(--color-text-danger); }
  .cd-card .del-btn { position: absolute; top: 4px; right: 4px; background: none; border: none; cursor: pointer; color: var(--color-text-tertiary); display: none; font-size: 12px; }
  .cd-card .color-btn { position: absolute; bottom: 4px; right: 4px; background: none; border: none; cursor: pointer; color: var(--cd-text, var(--color-text-tertiary)); display: none; font-size: 12px; }
  .edit-mode .cd-card .del-btn { display: block; }
  .edit-mode .cd-card .color-btn { display: block; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 6px; }
  .cal-day-name { font-size: 11px; color: var(--color-text-tertiary); text-align: center; padding: 2px 0; }
  .cal-day { font-size: 12px; text-align: center; padding: 5px 2px; border-radius: 4px; color: var(--color-text-secondary); }
  .cal-day.today { background: var(--color-background-info); color: var(--color-text-info); font-weight: 500; border-radius: 50%; }
  .cal-day.has-event { position: relative; }
  .cal-day.has-event::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--color-text-warning); position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); }
  .cal-month { font-size: 13px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; justify-content: space-between; }
  .cal-nav { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); font-size: 16px; padding: 2px 6px; border-radius: 4px; }
  .cal-nav:hover { background: var(--color-background-secondary); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--color-background-primary); border-radius: var(--border-radius-lg); padding: 1.25rem; width: 360px; max-width: 95vw; border: 0.5px solid var(--color-border-tertiary); }
  .modal h3 { font-size: 16px; font-weight: 500; margin-bottom: 1rem; color: var(--color-text-primary); }
  .modal label { display: block; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .modal input, .modal select { width: 100%; margin-bottom: 12px; font-size: 14px; padding: 8px 10px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; }
  .modal input:focus, .modal select:focus { border-color: var(--color-border-primary); }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; justify-content: flex-end; }
  .btn-primary { padding: 7px 16px; border-radius: var(--border-radius-md); background: var(--color-text-primary); color: var(--color-background-primary); border: none; cursor: pointer; font-size: 13px; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-cancel { padding: 7px 16px; border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-secondary); cursor: pointer; font-size: 13px; }
  .btn-cancel:hover { background: var(--color-background-secondary); }
  .section-add-btn { font-size: 12px; padding: 4px 10px; border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-tertiary); cursor: pointer; display: none; align-items: center; gap: 4px; }
  .section-add-btn:hover { color: var(--color-text-primary); }
  .edit-mode .section-add-btn { display: flex; }
  .color-swatch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: var(--color-text-primary); }

  /* Timetable */
  .tt-upload-area { border: 1.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 1.25rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; position: relative; }
  .tt-upload-area:hover, .tt-upload-area.drag-over { border-color: var(--color-border-primary); background: var(--color-background-secondary); }
  .tt-upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .tt-upload-area .tt-upload-icon { font-size: 28px; color: var(--color-text-tertiary); margin-bottom: 6px; }
  .tt-upload-area p { font-size: 13px; color: var(--color-text-secondary); margin: 0; }
  .tt-upload-area small { font-size: 11px; color: var(--color-text-tertiary); }
  .tt-file-name { font-size: 12px; color: var(--color-text-success); margin-top: 6px; display: flex; align-items: center; gap: 4px; justify-content: center; }
  .tt-week-nav { display: flex; align-items: center; justify-content: space-between; margin: 0.75rem 0 0.5rem; }
  .tt-week-label { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
  .tt-grid { display: grid; grid-template-columns: 48px repeat(5, 1fr); gap: 2px; font-size: 11px; }
  .tt-grid-7 { grid-template-columns: 48px repeat(7, 1fr); }
  .tt-header { background: var(--color-background-secondary); border-radius: 4px; padding: 4px 2px; text-align: center; color: var(--color-text-secondary); font-weight: 500; }
  .tt-header.today-col { background: var(--color-background-info); color: var(--color-text-info); }
  .tt-time { color: var(--color-text-tertiary); text-align: right; padding-right: 6px; line-height: 1; display: flex; align-items: flex-start; justify-content: flex-end; }
  .tt-cell { min-height: 28px; border-radius: 4px; position: relative; }
  .tt-event { border-radius: 4px; padding: 3px 5px; margin: 1px 0; overflow: hidden; cursor: default; }
  .tt-event-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tt-event-loc { color: inherit; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tt-empty { font-size: 13px; color: var(--color-text-tertiary); text-align: center; padding: 1.5rem; }
  .tt-controls { display: flex; align-items: center; gap: 6px; }
  .tt-clear-btn { font-size: 11px; padding: 3px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-tertiary); cursor: pointer; }
  .tt-clear-btn:hover { color: var(--color-text-danger); border-color: var(--color-border-danger); }
  .tt-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tt-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--color-text-secondary); }
  .tt-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* Export/Import */
  .data-bar { display: flex; gap: 8px; margin-top: 1rem; justify-content: flex-end; }
  .data-btn { font-size: 12px; padding: 5px 12px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .data-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
</style>
</head>
<body>

<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div>
      <h1>Student dashboard</h1>
      <span id="date-display"></span>
    </div>
    <button class="edit-btn" id="edit-toggle" onclick="toggleEdit()">
      <i class="ti ti-edit" aria-hidden="true"></i> Customise
    </button>
  </div>

  <div class="grid">
    <div>
      <div class="panel">
        <div class="panel-title">Quick links</div>
        <div class="links-grid" id="links-grid"></div>
      </div>
      <div class="panel" style="margin-top:1rem">
        <div class="panel-title">
          Alerts &amp; reminders
          <button class="section-add-btn" onclick="openModal('modal-alert')"><i class="ti ti-plus" aria-hidden="true"></i> Add</button>
        </div>
        <div id="alerts-list"></div>
      </div>
      <!-- Timetable Panel -->
      <div class="panel" style="margin-top:1rem">
        <div class="panel-title">
          Timetable
          <div class="tt-controls">
            <button class="tt-clear-btn" id="tt-clear-btn" onclick="clearTimetable()" style="display:none"><i class="ti ti-trash" aria-hidden="true"></i> Clear</button>
          </div>
        </div>
        <div id="tt-upload-section">
          <div class="tt-upload-area" id="tt-drop-zone">
            <input type="file" accept=".ics" id="ics-file-input" onchange="handleIcsUpload(event)">
            <div class="tt-upload-icon"><i class="ti ti-calendar-upload" aria-hidden="true"></i></div>
            <p>Drop your timetable <strong>.ics</strong> file here</p>
            <small>or click to browse &mdash; exported from IN4SIT / Google Calendar / Outlook</small>
          </div>
          <div id="tt-file-name" class="tt-file-name" style="display:none"></div>
        </div>
        <div id="tt-view" style="display:none">
          <div class="tt-week-nav">
            <button class="cal-nav" onclick="ttPrevWeek()"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
            <span class="tt-week-label" id="tt-week-label"></span>
            <button class="cal-nav" onclick="ttNextWeek()"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
          </div>
          <div id="tt-grid-container"></div>
          <div class="tt-legend" id="tt-legend"></div>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div class="panel">
        <div class="panel-title">
          Upcoming deadlines
          <button class="section-add-btn" onclick="openModal('modal-countdown')"><i class="ti ti-plus" aria-hidden="true"></i> Add</button>
        </div>
        <div class="countdown-grid" id="countdown-grid"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Calendar</div>
        <div class="cal-month">
          <button class="cal-nav" onclick="prevMonth()"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
          <span id="cal-month-label"></span>
          <button class="cal-nav" onclick="nextMonth()"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
        </div>
        <div class="cal-grid" id="cal-day-names"></div>
        <div class="cal-grid" id="cal-days"></div>
      </div>
    </div>
  </div>
  <!-- Export / Import bar (GitHub Pages data portability) -->
  <div class="data-bar">
    <button class="data-btn" onclick="exportData()"><i class="ti ti-download" aria-hidden="true"></i> Export data</button>
    <button class="data-btn" onclick="document.getElementById('import-file').click()"><i class="ti ti-upload" aria-hidden="true"></i> Import data</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<!-- Add Link Modal -->
<div class="modal-overlay" id="modal-link" onclick="if(event.target===this)closeModal('modal-link')">
  <div class="modal">
    <h3>Add quick link</h3>
    <label>Name</label><input type="text" id="link-name" placeholder="e.g. IN4SIT">
    <label>URL</label><input type="text" id="link-url" placeholder="https://...">
    <label>Category</label>
    <select id="link-cat">
      <option>Portal</option><option>Library</option><option>Tool</option><option>App</option><option>Forum</option><option>Other</option>
    </select>
    <label>Colour</label>
    <div class="color-swatch-row" id="link-color-row"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-link')">Cancel</button>
      <button class="btn-primary" onclick="saveLink()">Add link</button>
    </div>
  </div>
</div>

<!-- Add Alert Modal -->
<div class="modal-overlay" id="modal-alert" onclick="if(event.target===this)closeModal('modal-alert')">
  <div class="modal">
    <h3>Add alert</h3>
    <label>Module code</label><input type="text" id="alert-mod" placeholder="e.g. RSE3204">
    <label>Message</label><input type="text" id="alert-msg" placeholder="e.g. Quiz 2 due Friday">
    <label>Date (optional)</label><input type="date" id="alert-date">
    <label>Colour</label>
    <div class="color-swatch-row" id="alert-color-row"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-alert')">Cancel</button>
      <button class="btn-primary" onclick="saveAlert()">Add alert</button>
    </div>
  </div>
</div>

<!-- Add Countdown Modal -->
<div class="modal-overlay" id="modal-countdown" onclick="if(event.target===this)closeModal('modal-countdown')">
  <div class="modal">
    <h3>Add countdown</h3>
    <label>Label</label><input type="text" id="cd-label-in" placeholder="e.g. Midterm exam">
    <label>Date</label><input type="date" id="cd-date-in">
    <label>Colour</label>
    <div class="color-swatch-row" id="cd-color-row"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-countdown')">Cancel</button>
      <button class="btn-primary" onclick="saveCountdown()">Add</button>
    </div>
  </div>
</div>

<!-- Color Picker Modal -->
<div class="modal-overlay" id="modal-color" onclick="if(event.target===this)closeModal('modal-color')">
  <div class="modal">
    <h3>Choose colour</h3>
    <div class="color-swatch-row" id="color-picker-row"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-color')">Cancel</button>
    </div>
  </div>
</div>

<script>
const COLORS = [
  {id:'none',   label:'Default', bg:'',        border:'',        text:'',        sub:''},
  {id:'blue',   label:'Blue',    bg:'#E6F1FB', border:'#85B7EB', text:'#0C447C', sub:'#185FA5'},
  {id:'teal',   label:'Teal',    bg:'#E1F5EE', border:'#5DCAA5', text:'#085041', sub:'#0F6E56'},
  {id:'purple', label:'Purple',  bg:'#EEEDFE', border:'#AFA9EC', text:'#3C3489', sub:'#534AB7'},
  {id:'amber',  label:'Amber',   bg:'#FAEEDA', border:'#EF9F27', text:'#633806', sub:'#854F0B'},
  {id:'coral',  label:'Coral',   bg:'#FAECE7', border:'#F0997B', text:'#712B13', sub:'#993C1D'},
  {id:'pink',   label:'Pink',    bg:'#FBEAF0', border:'#ED93B1', text:'#72243E', sub:'#993556'},
  {id:'green',  label:'Green',   bg:'#EAF3DE', border:'#97C459', text:'#27500A', sub:'#3B6D11'},
  {id:'red',    label:'Red',     bg:'#FCEBEB', border:'#F09595', text:'#791F1F', sub:'#A32D2D'},
  {id:'gray',   label:'Gray',    bg:'#F1EFE8', border:'#B4B2A9', text:'#444441', sub:'#5F5E5A'},
];

const CAT_ICONS = {Portal:'ti-layout-dashboard',Library:'ti-books',Tool:'ti-tool',App:'ti-device-mobile',Forum:'ti-messages',Other:'ti-link'};

const DEFAULT_LINKS = [
  {id:'l1', name:'IN4SIT',            url:'https://in4sit.singaporetech.edu.sg', cat:'Portal',  icon:'ti-school',            color:'blue'},

function daysFromNow(d) {
  const dt = new Date(); dt.setDate(dt.getDate() + d); return dt.toISOString().slice(0,10);
}

function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

const selectedColors = {};

function getColor(id) { return COLORS.find(c => c.id === id) || COLORS[0]; }

function colorStyle(colorId, type) {
  const c = getColor(colorId);
  if (!c.bg) return '';
  if (type === 'link')  return `--lc-bg:${c.bg};--lc-text:${c.text};--lc-sub:${c.sub};border-color:${c.border}`;
  if (type === 'alert') return `--ai-bg:${c.bg};--ai-text:${c.text};--ai-sub:${c.sub};--ai-border:${c.border}`;
  if (type === 'cd')    return `--cd-bg:${c.bg};--cd-text:${c.text};--cd-sub:${c.sub};--cd-border:${c.border}`;
  return '';
}

function toggleEdit() {
  editMode = !editMode;
  document.getElementById('dashboard').classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('edit-toggle');
  btn.classList.toggle('active', editMode);
  btn.innerHTML = editMode
    ? '<i class="ti ti-check" aria-hidden="true"></i> Done'
    : '<i class="ti ti-edit" aria-hidden="true"></i> Customise';
  renderAll();
}

function renderLinks() {
  const g = document.getElementById('links-grid');
  g.innerHTML = '';
  links.forEach(lk => {
    const c = document.createElement('a');
    c.className = 'link-card';
    c.href = editMode ? '#' : lk.url;
    if (!editMode && lk.url !== '#') c.target = '_blank';
    if (editMode) c.onclick = e => e.preventDefault();
    const style = colorStyle(lk.color, 'link');
    if (style) c.setAttribute('style', style);
    const icon = lk.icon || (CAT_ICONS[lk.cat] || 'ti-link');
    c.innerHTML =
      `<i class="ti ${icon} lc-icon" aria-hidden="true"></i>` +
      `<span class="lc-name">${lk.name}</span>` +
      `<span class="lc-tag">${lk.cat}</span>` +
      `<button class="del-btn" onclick="deleteItem('links','${lk.id}');event.stopPropagation();event.preventDefault()" aria-label="Remove"><i class="ti ti-x" aria-hidden="true"></i></button>` +
      `<button class="color-btn" onclick="openColorPicker('links','${lk.id}');event.stopPropagation();event.preventDefault()" aria-label="Change colour"><i class="ti ti-palette" aria-hidden="true"></i></button>`;
    g.appendChild(c);
  });
  if (editMode) {
    const add = document.createElement('div');
    add.className = 'link-card add-card';
    add.innerHTML = '<i class="ti ti-plus" aria-hidden="true"></i><span>Add link</span>';
    add.onclick = () => openModal('modal-link');
    g.appendChild(add);
  }
}

function renderAlerts() {
  const l = document.getElementById('alerts-list');
  l.innerHTML = '';
  if (!alerts.length) {
    l.innerHTML = '<p style="font-size:13px;color:var(--color-text-tertiary);text-align:center;padding:1rem">No alerts</p>';
    return;
  }
  alerts.forEach(a => {
    const d = document.createElement('div');
    d.className = 'alert-item';
    const style = colorStyle(a.color, 'alert');
    if (style) d.setAttribute('style', style);
    d.innerHTML =
      `<i class="ti ti-alert-triangle ai-icon" aria-hidden="true"></i>` +
      `<div><div class="ai-name">${a.mod}</div><div class="ai-msg">${a.msg}</div>${a.date ? `<div class="ai-meta">${a.date}</div>` : ''}</div>` +
      `<button class="del-btn" onclick="deleteItem('alerts','${a.id}')" aria-label="Remove"><i class="ti ti-x" aria-hidden="true"></i></button>` +
      `<button class="color-btn" onclick="openColorPicker('alerts','${a.id}')" aria-label="Change colour"><i class="ti ti-palette" aria-hidden="true"></i></button>`;
    l.appendChild(d);
  });
}

function renderCountdowns() {
  const g = document.getElementById('countdown-grid');
  g.innerHTML = '';
  countdowns.forEach(c => {
    const d = daysUntil(c.date);
    const el = document.createElement('div');
    el.className = 'cd-card' + (d <= 3 && !c.color ? ' urgent' : '');
    const style = colorStyle(c.color, 'cd');
    if (style) el.setAttribute('style', style);
    el.innerHTML =
      `<div class="cd-num">${d < 0 ? 'Past' : d}</div>` +
      `<div class="cd-label">${c.label}</div>` +
      `<button class="del-btn" onclick="deleteItem('countdowns','${c.id}')" aria-label="Remove"><i class="ti ti-x" aria-hidden="true"></i></button>` +
      `<button class="color-btn" onclick="openColorPicker('countdowns','${c.id}')" aria-label="Change colour"><i class="ti ti-palette" aria-hidden="true"></i></button>`;
    g.appendChild(el);
  });
}

function daysUntil(iso) {
  const now = new Date(); now.setHours(0,0,0,0);
  const t = new Date(iso); t.setHours(0,0,0,0);
  return Math.round((t - now) / 86400000);
}

function renderCalendar() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = months[calMonth] + ' ' + calYear;
  document.getElementById('cal-day-names').innerHTML = 'MTWTFSS'.split('').map(d => `<div class="cal-day-name">${d}</div>`).join('');
  const daysEl = document.getElementById('cal-days');
  daysEl.innerHTML = '';
  const first = new Date(calYear, calMonth, 1).getDay();
  const offset = first === 0 ? 6 : first - 1;
  const total = new Date(calYear, calMonth + 1, 0).getDate();
  const eventDates = countdowns.map(c => c.date);
  for (let i = 0; i < offset; i++) daysEl.appendChild(document.createElement('div'));
  for (let d = 1; d <= total; d++) {
    const el = document.createElement('div');
    const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = todayDate.getFullYear()===calYear && todayDate.getMonth()===calMonth && todayDate.getDate()===d;
    el.className = 'cal-day' + (isToday ? ' today' : '') + (eventDates.includes(iso) ? ' has-event' : '');
    el.textContent = d;
    daysEl.appendChild(el);
  }
}

function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

function renderAll() { renderLinks(); renderAlerts(); renderCountdowns(); renderCalendar(); }

function deleteItem(type, id) {
  if (type === 'links')      { links = links.filter(x => x.id !== id); save('sit_links', links); renderLinks(); }
  else if (type === 'alerts'){ alerts = alerts.filter(x => x.id !== id); save('sit_alerts', alerts); renderAlerts(); }
  else                       { countdowns = countdowns.filter(x => x.id !== id); save('sit_cds', countdowns); renderCountdowns(); renderCalendar(); }
}

function renderSwatchRow(rowId, selectedId, modalKey) {
  const row = document.getElementById(rowId);
  if (!row) return;
  row.innerHTML = COLORS.map(c => {
    const bg = c.bg || 'var(--color-background-secondary)';
    const sel = c.id === selectedId;
    return `<div class="color-swatch${sel?' selected':''}" style="background:${bg};border:2px solid ${sel?'var(--color-text-primary)':'transparent'}" onclick="selectModalColor('${c.id}','${modalKey}')" title="${c.label}"></div>`;
  }).join('');
}

function selectModalColor(colorId, modalKey) {
  selectedColors[modalKey] = colorId;
  const rowMap = {'modal-link':'link-color-row','modal-alert':'alert-color-row','modal-countdown':'cd-color-row'};
  renderSwatchRow(rowMap[modalKey], colorId, modalKey);
}

function openModal(id) {
  selectedColors[id] = 'none';
  document.getElementById(id).classList.add('open');
  const rowMap = {'modal-link':'link-color-row','modal-alert':'alert-color-row','modal-countdown':'cd-color-row'};
  if (rowMap[id]) renderSwatchRow(rowMap[id], 'none', id);
  if (id === 'modal-link') { document.getElementById('link-name').value=''; document.getElementById('link-url').value='https://'; document.getElementById('link-cat').value='Portal'; }
  if (id === 'modal-alert') { document.getElementById('alert-mod').value=''; document.getElementById('alert-msg').value=''; document.getElementById('alert-date').value=''; }
  if (id === 'modal-countdown') { document.getElementById('cd-label-in').value=''; document.getElementById('cd-date-in').value=''; }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function openColorPicker(type, id) {
  colorTarget = { type, id };
  const arr = type==='links'?links:type==='alerts'?alerts:countdowns;
  const current = arr.find(x=>x.id===id)?.color || 'none';
  const row = document.getElementById('color-picker-row');
  row.innerHTML = COLORS.map(c => {
    const bg = c.bg || 'var(--color-background-secondary)';
    const sel = c.id === current;
    return `<div class="color-swatch${sel?' selected':''}" style="background:${bg};border:2px solid ${sel?'var(--color-text-primary)':'transparent'}" onclick="applyColor('${c.id}')" title="${c.label}"></div>`;
  }).join('');
  document.getElementById('modal-color').classList.add('open');
}

function applyColor(colorId) {
  const { type, id } = colorTarget;
  if (type === 'links')       { const l = links.find(x=>x.id===id); if(l) l.color=colorId; save('sit_links',links); renderLinks(); }
  else if (type === 'alerts') { const a = alerts.find(x=>x.id===id); if(a) a.color=colorId; save('sit_alerts',alerts); renderAlerts(); }
  else                        { const c = countdowns.find(x=>x.id===id); if(c) c.color=colorId; save('sit_cds',countdowns); renderCountdowns(); }
  closeModal('modal-color');
}

/* ── ICS Upload ── */
function handleIcsUpload(e) { const f = e.target.files[0]; if (f) processIcsFile(f); }

function processIcsFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const events = parseIcs(ev.target.result);
    if (!events.length) { alert('No events found in this .ics file.'); return; }
    save('sit_ics_events', events);
    save('sit_ics_name', file.name);
    showTimetable(events, file.name);
  };
  reader.readAsText(file);
}

/* ── ICS Parser ── */
function parseIcs(text) {
  // Unfold lines (RFC 5545: lines can be continued with CRLF + whitespace)
  const unfolded = text.replace(/\r\n[ \t]/g, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = unfolded.split('\n');
  const events = [];
  let cur = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (line === 'BEGIN:VEVENT') { cur = {}; continue; }
    if (line === 'END:VEVENT') { if (cur) { const ev = buildEvent(cur); if (ev) events.push(ev); } cur = null; continue; }
    if (!cur) continue;
    const idx = line.indexOf(':');
    if (idx < 0) continue;
    const key = line.slice(0, idx).toUpperCase();
    const val = line.slice(idx + 1);
    // strip parameters from key e.g. DTSTART;TZID=Asia/Singapore
    const baseKey = key.split(';')[0];
    cur[baseKey] = val;
  }
  return events;
}

function parseIcsDate(str) {
  if (!str) return null;
  // DATE-TIME: 20250101T090000Z or 20250101T090000
  // DATE only: 20250101
  str = str.replace('Z','');
  if (str.length === 8) return new Date(+str.slice(0,4), +str.slice(4,6)-1, +str.slice(6,8), 0, 0);
  return new Date(+str.slice(0,4), +str.slice(4,6)-1, +str.slice(6,8), +str.slice(9,11), +str.slice(11,13));
}

function buildEvent(raw) {
  const start = parseIcsDate(raw['DTSTART']);
  const end   = parseIcsDate(raw['DTEND']) || start;
  if (!start) return null;
  const summary  = (raw['SUMMARY']  || 'Untitled').replace(/\\n/g,'\n').replace(/\\,/g,',');
  const location = (raw['LOCATION'] || '').replace(/\\n/g,' ').replace(/\\,/g,',');
  return { summary, location, start: start.toISOString(), end: end.toISOString(), uid: raw['UID'] || '' };
}

/* ── Timetable display ── */
const TT_COLORS = [
  {bg:'#E6F1FB',text:'#0C447C'},{bg:'#E1F5EE',text:'#085041'},{bg:'#EEEDFE',text:'#3C3489'},
  {bg:'#FAEEDA',text:'#633806'},{bg:'#FAECE7',text:'#712B13'},{bg:'#FBEAF0',text:'#72243E'},
  {bg:'#EAF3DE',text:'#27500A'},{bg:'#FCF0E6',text:'#7A3E00'},
];
const ttColorMap = {};
let ttColorIdx = 0;
function ttColor(key) {
  if (!ttColorMap[key]) { ttColorMap[key] = TT_COLORS[ttColorIdx % TT_COLORS.length]; ttColorIdx++; }
  return ttColorMap[key];
}

let ttEvents = [];
let ttWeekOffset = 0;

function getWeekStart(offset) {
  const d = new Date(); d.setHours(0,0,0,0);
  const day = d.getDay(); // 0=Sun
  const mon = new Date(d); mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  return mon;
}

function showTimetable(events, fileName) {
  ttEvents = events;
  ttColorIdx = 0;
  Object.keys(ttColorMap).forEach(k => delete ttColorMap[k]);
  document.getElementById('tt-upload-section').style.display = 'none';
  document.getElementById('tt-view').style.display = 'block';
  document.getElementById('tt-clear-btn').style.display = '';
  const fn = document.getElementById('tt-file-name');
  fn.style.display = 'flex';
  fn.innerHTML = `<i class="ti ti-check" aria-hidden="true"></i> ${fileName}`;
  ttWeekOffset = 0;
  renderTimetable();
}

function renderTimetable() {
  const weekStart = getWeekStart(ttWeekOffset);
  const weekEnd   = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);

  // Build label
  const fmt = d => d.toLocaleDateString('en-SG', {day:'numeric', month:'short'});
  document.getElementById('tt-week-label').textContent = fmt(weekStart) + ' – ' + fmt(weekEnd);

  // Filter events in this week
  const days = Array.from({length:7}, (_,i) => { const d = new Date(weekStart); d.setDate(weekStart.getDate()+i); return d; });
  const todayIso = new Date().toISOString().slice(0,10);

  const dayEvents = days.map(d => {
    const iso = d.toISOString().slice(0,10);
    return ttEvents.filter(ev => ev.start.slice(0,10) === iso).sort((a,b) => a.start.localeCompare(b.start));
  });

  // Determine time range
  const allToday = dayEvents.flat();
  let minH = 8, maxH = 18;
  allToday.forEach(ev => {
    const h1 = new Date(ev.start).getHours();
    const h2 = new Date(ev.end).getHours() + (new Date(ev.end).getMinutes() > 0 ? 1 : 0);
    if (h1 < minH) minH = h1;
    if (h2 > maxH) maxH = h2;
  });

  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const container = document.getElementById('tt-grid-container');

  if (!allToday.length) {
    container.innerHTML = '<div class="tt-empty">No classes this week</div>';
    renderTtLegend();
    return;
  }

  // Build simple list layout per day (more reliable than CSS grid pixel mapping)
  let html = `<div style="display:grid;grid-template-columns:48px repeat(7,1fr);gap:4px;overflow-x:auto;">`;
  // Header row
  html += `<div></div>`;
  days.forEach((d, i) => {
    const iso = d.toISOString().slice(0,10);
    const isToday = iso === todayIso;
    html += `<div class="tt-header${isToday?' today-col':''}">${DAY_NAMES[i]}<br><span style="font-weight:400;opacity:.75">${d.getDate()}</span></div>`;
  });

  // Hour rows
  for (let h = minH; h <= maxH; h++) {
    html += `<div class="tt-time" style="padding-top:3px;font-size:11px">${String(h).padStart(2,'0')}:00</div>`;
    days.forEach((d, di) => {
      const evs = dayEvents[di].filter(ev => new Date(ev.start).getHours() === h);
      html += `<div class="tt-cell">`;
      evs.forEach(ev => {
        const col = ttColor(ev.summary);
        const startM = new Date(ev.start).getMinutes();
        const endH   = new Date(ev.end).getHours();
        const endM   = new Date(ev.end).getMinutes();
        const timeStr = `${String(new Date(ev.start).getHours()).padStart(2,'0')}:${String(startM).padStart(2,'0')}–${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
        html += `<div class="tt-event" style="background:${col.bg};color:${col.text}" title="${ev.summary}${ev.location ? '\n'+ev.location : ''}\n${timeStr}">
          <div class="tt-event-title">${ev.summary}</div>
          ${ev.location ? `<div class="tt-event-loc">${ev.location}</div>` : ''}
          <div style="font-size:10px;opacity:.7">${timeStr}</div>
        </div>`;
      });
      html += `</div>`;
    });
  }
  html += `</div>`;
  container.innerHTML = html;
  renderTtLegend();
}

function renderTtLegend() {
  const seen = {};
  ttEvents.forEach(ev => { if (!seen[ev.summary]) { seen[ev.summary] = ttColor(ev.summary); } });
  const lg = document.getElementById('tt-legend');
  lg.innerHTML = Object.entries(seen).map(([name, col]) =>
    `<div class="tt-legend-item"><div class="tt-legend-dot" style="background:${col.bg};border:1px solid ${col.text}"></div>${name}</div>`
  ).join('');
}

function ttPrevWeek() { ttWeekOffset--; renderTimetable(); }
function ttNextWeek() { ttWeekOffset++; renderTimetable(); }

function clearTimetable() {
  ttEvents = []; ttWeekOffset = 0; ttColorIdx = 0;
  save('sit_ics_events', []); save('sit_ics_name', '');

}

/* ── Export / Import data (GitHub Pages portability) ── */
function exportData() {
  const payload = {
    version: 1,
    links:      load('sit_links', DEFAULT_LINKS),
    alerts:     load('sit_alerts', DEFAULT_ALERTS),
    countdowns: load('sit_cds', DEFAULT_COUNTDOWNS),
    ics_events: load('sit_ics_events', []),
    ics_name:   load('sit_ics_name', ''),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dashboard-data.json';
  a.click();
}

function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.links)      { save('sit_links', d.links);      links = d.links; }
      if (d.alerts)     { save('sit_alerts', d.alerts);    alerts = d.alerts; }
      if (d.countdowns) { save('sit_cds', d.countdowns);   countdowns = d.countdowns; }
      if (d.ics_events && d.ics_events.length) showTimetable(d.ics_events, d.ics_name || 'timetable.ics');
      renderAll();
      alert('Data imported successfully!');
    } catch { alert('Invalid file. Please use a previously exported dashboard-data.json.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
</script>
</body>
</html>
